<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading</title>
<style>

:root{
  --server-name: "DL PRODUCTIONS";
  --server-tag:  "CITY ROLEPLAY";
  --c-bg:        #faf8f2;
  --c-paper:     #1c1d1f;
  --c-brass:     #a8791f;
  --c-brick:     #8a3b2f;
  --c-blue:      #4f9fc4;
  --c-panel:     rgba(255,255,255,0.80);
  --c-panel-2:   rgba(255,255,255,0.88);
  --c-line:      rgba(28,29,31,0.12);
  --c-dim:       #5b5e63;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%;
  background:var(--c-bg);
  overflow:hidden;
  font-family:"Segoe UI","Arial",sans-serif;
  color:var(--c-paper);
}

#stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

/* photo carousel background */
.carousel{ position:absolute; inset:0; z-index:0; }
.slide{
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  opacity:0; transform:scale(1.05);
  transition:opacity 1.8s ease, transform 11s linear;
  filter:saturate(0.95) brightness(1.02) contrast(1.01);
}
.slide.active{ opacity:1; transform:scale(1); }

.grade{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(250,248,242,.9) 0%, rgba(250,248,242,.32) 22%, rgba(250,248,242,.32) 62%, rgba(250,248,242,.94) 100%),
              linear-gradient(100deg, rgba(168,121,31,.08), rgba(79,159,196,.06));
}
.grain{
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.35; z-index:2;
  background-image:repeating-linear-gradient(0deg, rgba(28,29,31,0.03) 0px, rgba(28,29,31,0.03) 1px, transparent 1px, transparent 3px);
}

/* ============ HEADER / LOGO, top-left ============ */
.logo-row{
  position:absolute; top:28px; left:32px; z-index:5;
  display:flex; align-items:center; gap:14px;
}
.logo-mark{ width:52px; height:52px; flex-shrink:0; }
.logo-text{ display:flex; flex-direction:column; }
.logo-name{
  font-size:26px; font-weight:700; letter-spacing:.02em;
  color:var(--c-paper); text-shadow:0 1px 10px rgba(255,255,255,.6);
  line-height:1.1;
}
.logo-name .accent{ color:var(--c-blue); }
.logo-tag{
  font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--c-brass); margin-top:2px;
  font-family:"Consolas","Courier New",monospace;
}

/* ============ MAIN WELCOME PANEL, left ============ */
.welcome-panel{
  position:absolute; top:96px; left:32px; width:600px; max-height:420px;
  z-index:5;
  background:var(--c-panel);
  border:1px solid var(--c-line);
  border-radius:4px;
  padding:22px 26px;
  backdrop-filter:blur(4px);
  box-shadow:0 8px 30px rgba(28,29,31,0.08);
}
.welcome-title{
  font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--c-paper); margin-bottom:14px;
  border-bottom:1px solid var(--c-line); padding-bottom:10px;
}
.welcome-body{
  font-size:12.5px; line-height:1.6; color:var(--c-dim);
  max-height:280px; overflow:hidden;
}
.welcome-body p{ margin-bottom:9px; }
.welcome-body b{ color:var(--c-paper); }

.loading-line{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--c-line);
  display:flex; align-items:center; gap:12px;
}
.loading-text{ font-size:14px; font-weight:600; color:var(--c-paper); }
.loading-dots{ display:flex; gap:6px; }
.loading-dots span{
  width:9px; height:9px; border-radius:2px;
  background:rgba(28,29,31,.14);
  transition:background .3s ease;
}
.loading-dots span.on{ background:var(--c-brass); }

/* ============ SIDE INFO PANELS, right ============ */
.side-panels{
  position:absolute; top:96px; right:32px; width:270px; z-index:5;
  display:flex; flex-direction:column; gap:16px;
}
.info-panel{
  background:var(--c-panel-2);
  border:1px solid var(--c-line);
  border-radius:4px;
  padding:16px 18px;
  backdrop-filter:blur(4px);
  box-shadow:0 8px 30px rgba(28,29,31,0.08);
}
.info-title{
  font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--c-blue); margin-bottom:10px;
}
.info-body{ font-size:12px; line-height:1.55; color:var(--c-dim); }
.info-body b{ color:var(--c-paper); }
.info-body .highlight{ color:var(--c-brass); font-weight:600; }

/* ============ SCENE CAPTION, bottom-left ============ */
.scene-caption{
  position:absolute; left:32px; bottom:64px; z-index:5;
  font-family:"Consolas","Courier New",monospace;
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--c-dim); opacity:.85;
  display:flex; align-items:center; gap:8px;
  text-shadow:0 1px 6px rgba(255,255,255,.7);
}
.scene-caption::before{ content:""; width:5px; height:5px; background:var(--c-blue); display:inline-block; }

/* ============ FOOTER BAR ============ */
.footer-bar{
  position:absolute; bottom:0; left:0; right:0; z-index:6;
  padding:14px 32px;
  background:linear-gradient(0deg, rgba(250,248,242,.85), transparent);
  display:flex; justify-content:space-between; align-items:center;
  font-family:"Consolas","Courier New",monospace;
  font-size:10.5px; letter-spacing:.05em; color:var(--c-dim);
}
.footer-bar a{ color:var(--c-blue); text-decoration:none; }
.footer-bar a:hover{ text-decoration:underline; }
.footer-links{ display:flex; gap:16px; align-items:center; }
.footer-links button{
  background:none; border:none; color:var(--c-dim); font-family:inherit; font-size:10.5px;
  letter-spacing:.05em; cursor:pointer; padding:0;
}
.footer-links button:hover{ color:var(--c-blue); }

/* ============ RULES MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; z-index:20;
  background:rgba(28,29,31,.45); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
}
.modal-overlay.open{ display:flex; }
.modal{
  width:min(720px, 88vw); max-height:80vh;
  background:#ffffff; border:1px solid var(--c-line);
  box-shadow:0 20px 60px rgba(28,29,31,.25);
  border-radius:6px;
  display:flex; flex-direction:column;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 26px; border-bottom:1px solid var(--c-line);
  background:linear-gradient(180deg, rgba(168,121,31,.04), transparent);
}
.modal-head h2{
  font-size:13px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--c-brass); font-weight:600;
  font-family:"Consolas","Courier New",monospace;
}
.modal-close{
  background:none; border:1px solid var(--c-line); color:var(--c-dim);
  width:28px; height:28px; cursor:pointer; font-size:15px; line-height:1;
  font-family:"Consolas",monospace; border-radius:3px;
}
.modal-close:hover{ color:var(--c-paper); border-color:var(--c-brass); }
.modal-body{
  padding:22px 26px 30px; overflow-y:auto;
  font-size:13.5px; line-height:1.65; color:var(--c-paper);
}
.modal-body::-webkit-scrollbar{ width:8px; }
.modal-body::-webkit-scrollbar-track{ background:#fff; }
.modal-body::-webkit-scrollbar-thumb{ background:var(--c-line); border-radius:4px; }
.modal-body h3{
  font-family:"Consolas","Courier New",monospace;
  font-size:11.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--c-brass); margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--c-line);
}
.modal-body h3:first-child{ margin-top:0; padding-top:0; border-top:none; }
.modal-body p{ margin-bottom:10px; opacity:.85; }
.modal-body ul{ list-style:none; padding:0; margin-bottom:4px; }
.modal-body li{ position:relative; padding-left:16px; margin-bottom:8px; opacity:.9; }
.modal-body li::before{ content:"\2014"; position:absolute; left:0; color:var(--c-brick); }
.modal-body table{ width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:12.5px; }
.modal-body th, .modal-body td{ border:1px solid var(--c-line); padding:8px 10px; text-align:left; }
.modal-body th{
  font-family:"Consolas","Courier New",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--c-brass);
  background:rgba(168,121,31,.06);
}

</style>
</head>
<body>

<div id="stage">

  <div class="carousel" id="carousel">
    <div class="slide active" style="background-image:url("logo.jpg");
